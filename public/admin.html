<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Ms+Madi&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap { max-width: 1100px; }
  .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 24px 0; }
  .links a { min-height: 48px; font-size: 15px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 28px 0 12px; }
  .bar h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; }
  .bar .actions { display: flex; gap: 8px; }
  .bar .btn { font-size: 13px; letter-spacing: .14em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  .tile { position: relative; padding-bottom: 6px; }
  .tile img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--line); }
  .tile .meta { padding: 6px 2px 0; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile button {
    position: absolute; top: 12px; right: 12px; border: 0; border-radius: 2px; padding: 6px 10px; cursor: pointer;
    background: rgba(255,248,241,.94); color: var(--err); font: 13px var(--body); letter-spacing: .08em;
  }
  .login { max-width: 360px; margin: 0 auto; }
  .err { color: var(--err); text-align: center; }
</style>
</head>
<body>
<header class="hero">
  <h1 class="names" id="title">&nbsp;</h1>
  <p class="eyebrow">Photo wall admin</p>
</header>
<main class="wrap">

  <section id="login" class="login">
    <label class="field" for="key">Admin key</label>
    <input id="key" type="password" autocomplete="current-password">
    <p style="margin-top:14px"><button class="btn" id="go">Open</button></p>
    <p class="err" id="loginErr"></p>
  </section>

  <section id="panel" class="hidden">
    <div class="links">
      <a class="btn" id="slideLink" target="_blank">Open slideshow</a>
      <a class="btn secondary" id="qrLink" target="_blank">Print QR cards</a>
      <a class="btn secondary" id="guestLink" target="_blank">Guest upload page</a>
    </div>
    <div class="bar">
      <h2 id="count">Photos</h2>
      <div class="actions">
        <button class="btn" id="zip" style="width:auto;min-height:40px">Download all</button>
        <button class="btn secondary" id="logout" style="width:auto;min-height:40px">Log out</button>
      </div>
    </div>
    <p class="note" id="zipStatus"></p>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  let key = store.get("adminKey") || "";
  let code = "";
  let zipping = false;

  fetch("/api/config").then((r) => r.json()).then((c) => { $("#title").textContent = c.title; }).catch(() => {});

  async function open() {
    const res = await fetch("/api/admin", { headers: { "x-admin-key": key } });
    if (!res.ok) {
      $("#loginErr").textContent = key ? "That key didn't work." : "";
      store.del("adminKey");
      return;
    }
    store.set("adminKey", key);
    code = (await res.json()).code;
    const q = code ? `?c=${encodeURIComponent(code)}` : "";
    $("#slideLink").href = `/slideshow${q}`;
    $("#qrLink").href = `/qr${q}`;
    $("#guestLink").href = `/${q}`;
    $("#login").classList.add("hidden");
    $("#panel").classList.remove("hidden");
    load();
  }

  async function load() {
    const res = await fetch("/api/photos", { headers: { "x-admin-key": key }, cache: "no-store" });
    const { photos } = await res.json();
    photos.reverse(); // newest first
    $("#count").textContent = `${photos.length} photo${photos.length === 1 ? "" : "s"}`;
    const grid = $("#grid");
    grid.innerHTML = "";
    for (const p of photos) {
      const tile = document.createElement("div");
      tile.className = "tile polaroid";
      const link = document.createElement("a");
      link.href = p.url;
      link.target = "_blank";
      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = link.href;
      img.alt = "";
      link.append(img);
      const meta = document.createElement("div");
      meta.className = "meta";
      const when = new Date(p.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      meta.textContent = p.name ? `${p.name} · ${when}` : when;
      const del = document.createElement("button");
      del.textContent = "Remove";
      del.onclick = async () => {
        if (!confirm("Remove this photo from the slideshow? This can't be undone.")) return;
        del.disabled = true;
        try {
          const r = await fetch(`/api/photos?url=${encodeURIComponent(p.url)}`, { method: "DELETE", headers: { "x-admin-key": key } });
          if (r.ok) return load();
          const { detail } = await r.json().catch(() => ({}));
          alert(`Couldn't remove it${detail ? ` (${detail})` : ""}. Try again.`);
        } catch {
          alert("Couldn't reach the server. Check your connection and try again.");
        }
        del.disabled = false;
      };
      tile.append(link, meta, del);
      grid.append(tile);
    }
  }

  // Zip every photo in the browser, fetching one at a time so memory stays low.
  // Chrome and Edge stream the zip straight to disk; other browsers build it in memory first.
  function zipName(p) {
    const d = new Date(p.t);
    const pad = (n) => String(n).padStart(2, "0");
    const stamp = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
    const who = p.name.replace(/[^\p{L}\p{N} _-]/gu, "").trim().replace(/\s+/g, "-").slice(0, 40);
    const [, rand, ext] = p.id.match(/^\d{13}-([0-9a-f]{8}).*\.(\w+)$/);
    return `${stamp}${who ? `_${who}` : ""}_${rand}.${ext}`;
  }

  async function downloadAll() {
    if (zipping) return;
    const status = $("#zipStatus");
    const res = await fetch("/api/photos", { headers: { "x-admin-key": key }, cache: "no-store" }).catch(() => null);
    if (!res?.ok) { status.textContent = "Couldn't load the photo list. Try again."; return; }
    const { photos } = await res.json();
    if (!photos.length) { status.textContent = "There are no photos yet."; return; }

    const filename = `${($("#title").textContent.trim() || "wedding").replace(/[^\p{L}\p{N} &_-]/gu, "")} photos.zip`;
    let writable = null;
    if (window.showSaveFilePicker) {
      try {
        const handle = await showSaveFilePicker({ suggestedName: filename, types: [{ description: "Zip file", accept: { "application/zip": [".zip"] } }] });
        writable = await handle.createWritable();
      } catch (err) {
        if (err.name === "AbortError") return; // picker cancelled
      }
    }

    zipping = true;
    $("#zip").disabled = true;
    let done = 0;
    const failed = [];
    async function* files() {
      for (const p of photos) {
        status.textContent = `Downloading ${done + 1} of ${photos.length}…`;
        try {
          const r = await fetch(p.url);
          if (!r.ok) throw new Error(r.status);
          yield { name: zipName(p), lastModified: new Date(p.t), input: r };
        } catch {
          failed.push(p);
        }
        done++;
      }
    }

    try {
      const { downloadZip } = await import("https://cdn.jsdelivr.net/npm/client-zip@2.4.5/index.js");
      const zip = downloadZip(files());
      if (writable) {
        await zip.body.pipeTo(writable);
      } else {
        const url = URL.createObjectURL(await zip.blob());
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }
      const saved = photos.length - failed.length;
      status.textContent = failed.length
        ? `Saved ${saved} of ${photos.length} photos. ${failed.length} couldn't be fetched; try again or open them from the grid.`
        : `Saved all ${saved} photos to ${filename}.`;
    } catch (err) {
      writable?.abort().catch(() => {});
      status.textContent = `The download stopped (${err?.message || err}). Try again.`;
    } finally {
      zipping = false;
      $("#zip").disabled = false;
    }
  }

  $("#zip").onclick = downloadAll;
  $("#go").onclick = () => { key = $("#key").value.trim(); open(); };
  $("#key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#go").click(); });
  $("#logout").onclick = () => { store.del("adminKey"); location.reload(); };
  if (key) open();
  setInterval(() => { if (!$("#panel").classList.contains("hidden")) load(); }, 30000);
})();
</script>
</body>
</html>
