<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .wrap { max-width: 1100px; }
  .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 24px 0; }
  .links a { min-height: 48px; font-size: 15px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 28px 0 12px; }
  .bar h2 { font-family: var(--display); font-weight: 500; font-size: 28px; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .meta {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; font-size: 12px; color: #fff;
    background: linear-gradient(transparent, rgba(0,0,0,.65));
  }
  .tile button {
    position: absolute; top: 6px; right: 6px; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer;
    background: rgba(255,255,255,.92); color: var(--err); font: 600 13px var(--body);
  }
  .login { max-width: 360px; margin: 0 auto; }
  .err { color: var(--err); text-align: center; }
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">Admin</p>
  <h1 id="title">&nbsp;</h1>
  <hr class="rule">

  <section id="login" class="login">
    <label class="field" for="key">Admin key</label>
    <input id="key" type="password" autocomplete="current-password">
    <p style="margin-top:14px"><button class="btn" id="go">Open</button></p>
    <p class="err" id="loginErr"></p>
  </section>

  <section id="panel" class="hidden">
    <div class="links">
      <a class="btn" id="slideLink" target="_blank">Open slideshow</a>
      <a class="btn secondary" id="qrLink" target="_blank">Print QR cards</a>
      <a class="btn secondary" id="guestLink" target="_blank">Guest upload page</a>
    </div>
    <div class="bar">
      <h2 id="count">Photos</h2>
      <button class="btn secondary" id="logout" style="width:auto;min-height:40px">Log out</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  let key = store.get("adminKey") || "";
  let code = "";

  fetch("/api/config").then((r) => r.json()).then((c) => { $("#title").textContent = c.title; }).catch(() => {});

  async function open() {
    const res = await fetch("/api/admin", { headers: { "x-admin-key": key } });
    if (!res.ok) {
      $("#loginErr").textContent = key ? "That key didn't work." : "";
      store.del("adminKey");
      return;
    }
    store.set("adminKey", key);
    code = (await res.json()).code;
    const q = code ? `?c=${encodeURIComponent(code)}` : "";
    $("#slideLink").href = `/slideshow${q}`;
    $("#qrLink").href = `/qr${q}`;
    $("#guestLink").href = `/${q}`;
    $("#login").classList.add("hidden");
    $("#panel").classList.remove("hidden");
    load();
  }

  async function load() {
    const res = await fetch("/api/photos", { headers: { "x-admin-key": key }, cache: "no-store" });
    const { photos } = await res.json();
    photos.reverse(); // newest first
    $("#count").textContent = `${photos.length} photo${photos.length === 1 ? "" : "s"}`;
    const grid = $("#grid");
    grid.innerHTML = "";
    for (const p of photos) {
      const tile = document.createElement("div");
      tile.className = "tile";
      const link = document.createElement("a");
      link.href = p.url;
      link.target = "_blank";
      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = link.href;
      img.alt = "";
      link.append(img);
      const meta = document.createElement("div");
      meta.className = "meta";
      const when = new Date(p.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      meta.textContent = p.name ? `${p.name} · ${when}` : when;
      const del = document.createElement("button");
      del.textContent = "Remove";
      del.onclick = async () => {
        if (!confirm("Remove this photo from the slideshow? This can't be undone.")) return;
        const r = await fetch(`/api/photos?url=${encodeURIComponent(p.url)}`, { method: "DELETE", headers: { "x-admin-key": key } });
        if (r.ok) load(); else alert("Couldn't remove it. Try again.");
      };
      tile.append(link, meta, del);
      grid.append(tile);
    }
  }

  $("#go").onclick = () => { key = $("#key").value.trim(); open(); };
  $("#key").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#go").click(); });
  $("#logout").onclick = () => { store.del("adminKey"); location.reload(); };
  if (key) open();
  setInterval(() => { if (!$("#panel").classList.contains("hidden")) load(); }, 30000);
})();
</script>
</body>
</html>
