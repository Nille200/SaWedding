<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Share your photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .drop { margin-top: 8px; }
  .status { margin-top: 24px; text-align: center; font-size: 15px; min-height: 24px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; padding: 0; list-style: none; }
  .grid li { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line); }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid .badge {
    position: absolute; inset: auto 6px 6px auto; width: 24px; height: 24px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; color: #fff; background: rgba(0,0,0,.45);
  }
  .grid li.done .badge { background: var(--ok); }
  .grid li.fail .badge { background: var(--err); }
  .grid li.busy img { opacity: .55; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 12px; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .linkerror { text-align: center; color: var(--err); }
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">Share your photos</p>
  <h1 id="title">&nbsp;</h1>
  <p class="subtitle" id="subtitle"></p>
  <hr class="rule">

  <section id="uploader">
    <label class="btn drop" for="file">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Choose photos
    </label>
    <input id="file" type="file" accept="image/*" multiple class="hidden">

    <label class="field" for="name">Your name (optional, shown on the big screen)</label>
    <input id="name" type="text" maxlength="40" autocomplete="given-name" placeholder="e.g. Aunt Lisa">

    <div id="progress" class="hidden">
      <div class="bar"><span id="barfill"></span></div>
    </div>
    <p class="status" id="status"></p>
    <ul class="grid" id="grid"></ul>
    <p class="note" id="hint">Your photos appear on the slideshow within a few seconds.</p>
  </section>

  <section id="linkerror" class="hidden">
    <p class="linkerror">This link looks incomplete. Please scan the QR code again.</p>
  </section>
</main>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // The QR code link carries ?c=EVENTCODE. Remember it in case the guest reopens the page.
  const params = new URLSearchParams(location.search);
  let code = params.get("c");
  if (code) store.set("eventCode", code); else code = store.get("eventCode") || "";

  const nameInput = $("#name");
  nameInput.value = store.get("guestName") || "";
  nameInput.addEventListener("change", () => store.set("guestName", nameInput.value.trim()));

  fetch("/api/config").then((r) => r.json()).then((cfg) => {
    $("#title").textContent = cfg.title;
    $("#subtitle").textContent = cfg.subtitle;
    document.title = `Share your photos · ${cfg.title}`;
    if (cfg.requireCode && !code) {
      $("#uploader").classList.add("hidden");
      $("#linkerror").classList.remove("hidden");
    }
  }).catch(() => {});

  const input = $("#file");
  const status = $("#status");
  let queue = [];
  let running = false;
  let total = 0, finished = 0, failed = 0;

  input.addEventListener("change", () => {
    const files = [...input.files];
    input.value = "";
    if (!files.length) return;
    for (const file of files) {
      const li = document.createElement("li");
      li.className = "busy";
      li.innerHTML = '<span class="badge">…</span>';
      $("#grid").prepend(li);
      queue.push({ file, li });
    }
    total += files.length;
    run();
  });

  function setStatus(msg, kind = "") {
    status.textContent = msg;
    status.className = "status " + kind;
  }

  function updateBar() {
    $("#progress").classList.toggle("hidden", finished >= total);
    $("#barfill").style.width = total ? `${Math.round((finished / total) * 100)}%` : "0";
  }

  async function run() {
    if (running) return;
    running = true;
    while (queue.length) {
      const { file, li } = queue.shift();
      setStatus(`Uploading ${finished + 1} of ${total}…`);
      updateBar();
      try {
        const blob = await prepare(file);
        const img = document.createElement("img");
        img.alt = "";
        img.src = URL.createObjectURL(blob);
        li.prepend(img);
        await send(blob);
        li.className = "done";
        li.querySelector(".badge").textContent = "✓";
      } catch (err) {
        failed++;
        li.className = "fail";
        li.querySelector(".badge").textContent = "!";
        if (err && err.message === "bad_code") {
          $("#uploader").classList.add("hidden");
          $("#linkerror").classList.remove("hidden");
          queue = [];
        }
      }
      finished++;
      updateBar();
    }
    running = false;
    if (failed) {
      setStatus(`${failed} photo${failed > 1 ? "s" : ""} didn't upload. Check your connection and try those again.`, "err");
    } else {
      setStatus("Thank you! Your photos are on their way to the big screen.", "ok");
    }
    failed = 0;
  }

  // Shrink big phone photos before upload: faster on venue wifi, and converts HEIC to JPEG.
  async function prepare(file) {
    const MAX = 2400;
    if (file.type === "image/gif") return file;
    try {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.src = url;
      await img.decode();
      const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      const out = await new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.86));
      if (out) return out;
    } catch {}
    if (["image/jpeg", "image/png", "image/webp"].includes(file.type)) return file;
    throw new Error("unsupported");
  }

  async function send(blob) {
    const name = nameInput.value.trim();
    store.set("guestName", name);
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const res = await fetch("/api/upload", {
          method: "POST",
          headers: {
            "content-type": blob.type || "image/jpeg",
            "x-event-code": code,
            "x-guest-name": encodeURIComponent(name),
          },
          body: blob,
        });
        if (res.status === 401) throw new Error("bad_code");
        if (res.ok) return;
        if (res.status < 500) throw new Error("rejected");
      } catch (err) {
        if (err.message === "bad_code" || err.message === "rejected") throw err;
      }
      await new Promise((r) => setTimeout(r, 1500 * (attempt + 1)));
    }
    throw new Error("failed");
  }
})();
</script>
</body>
</html>
